    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())

      gtag('config', 'G-P7JMC5VRSF', { send_page_view: false })

    <script>
      // Marks the document as script-enabled (scroll-reveal hides content only then). If the app
      // never mounts, the failsafe makes everything visible again after 6s.
      document.documentElement.classList.add('js')
      window.__kfb = setTimeout(function () {
        document.documentElement.classList.add('no-anim')
      }, 6000)
    </script>
